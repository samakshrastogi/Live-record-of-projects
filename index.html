<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Project Vault</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FIX: Dropdown Styling -->
    <style>
        select {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
        }

        select option {
            background-color: #1f2937;
            color: white;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 text-white min-h-screen">

    <!-- LOGIN -->
    <div id="loginPage" class="flex items-center justify-center h-screen">
        <div class="bg-white/10 backdrop-blur-lg p-8 rounded-2xl shadow-2xl w-80 border border-white/20">

            <h2 class="text-2xl font-bold mb-6 text-center">🚀 Project Vault</h2>

            <input id="username" placeholder="Username"
                class="w-full mb-4 p-3 rounded-lg bg-white/20 placeholder-gray-300 focus:outline-none">

            <input id="password" type="password" placeholder="Password"
                class="w-full mb-4 p-3 rounded-lg bg-white/20 placeholder-gray-300 focus:outline-none">

            <button onclick="login()" class="w-full bg-blue-500 py-2 rounded-lg hover:bg-blue-600 transition">
                Login
            </button>

            <p id="error" class="text-red-400 text-sm mt-2 hidden text-center">
                Invalid credentials
            </p>

        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="hidden p-6">

        <!-- HEADER -->
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold">📁 Project Vault</h1>
            <button onclick="logout()" class="bg-red-500 px-4 py-2 rounded-lg hover:bg-red-600 transition">
                Logout
            </button>
        </div>

        <!-- FILTER -->
        <div class="mb-6">
            <select id="filterCategory" onchange="loadProjects()"
                class="p-3 rounded-lg border border-white/20 bg-white/10 backdrop-blur-md shadow-md focus:outline-none">
            </select>
        </div>

        <!-- CARDS GRID -->
        <div id="projectContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
        </div>

    </div>

    <!-- SCRIPT -->
    <script type="module" src="card.js"></script>

</body>

</html>
