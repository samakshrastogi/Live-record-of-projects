<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Project Vault</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      min-height: 100vh;
    }

    /* GLASS */
    .glass {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* LOGIN */
    .login-box {
      max-width: 480px;
      width: 100%;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    /* INPUT FIX */
    input::placeholder {
      color: rgba(255,255,255,0.8) !important;
    }

    .form-control {
      color: white !important;
    }

    /* DASHBOARD */
    #dashboard {
      min-height: 100vh;
    }

    /* CARD */
    .card-custom {
      transition: 0.3s;
      border-radius: 14px;
      overflow: hidden;
    }

    .card-custom:hover {
      transform: translateY(-5px);
    }

    .card-custom img {
      height: 180px;
      object-fit: cover;
    }

    /* LINK */
    .project-link {
      color: #38bdf8;
      font-size: 14px;
      word-break: break-all;
    }

    .project-link:hover {
      color: #0ea5e9;
      text-decoration: underline;
    }

    /* CONTROLS */
    .controls {
      gap: 12px;
    }

    @media (max-width: 768px) {
      .controls {
        flex-direction: column;
      }

      .controls .form-control,
      .controls .form-select {
        width: 100% !important;
      }
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="d-flex justify-content-center align-items-center vh-100 px-3">
  <div class="glass login-box">

    <h1 class="text-center mb-3 fw-bold">🚀 Project Vault</h1>
    <p class="text-center text-secondary mb-4">Access your dashboard</p>

    <input id="username" class="form-control form-control-lg mb-3 bg-dark border-0" placeholder="Username">
    <input id="password" type="password" class="form-control form-control-lg mb-4 bg-dark border-0" placeholder="Password">

    <button onclick="login()" class="btn btn-primary btn-lg w-100">Login</button>

    <p id="error" class="text-danger text-center mt-3 d-none">Invalid credentials</p>

  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="container-fluid px-3 px-md-4 py-4 d-none">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>📁 Project Vault</h2>
    <button onclick="logout()" class="btn btn-danger">Logout</button>
  </div>

  <!-- CONTROLS -->
  <div class="d-flex flex-wrap controls mb-4">
    <select id="filterCategory" onchange="loadProjects()" class="form-select bg-dark text-white border-0 w-auto"></select>
    <input id="searchInput" type="text" placeholder="Search projects..." oninput="loadProjects()" class="form-control bg-dark border-0 w-auto">
  </div>

  <!-- CARDS -->
  <div id="projectContainer" class="row g-4"></div>

</div>

<script type="module" src="card.js"></script>

</body>
</html>
